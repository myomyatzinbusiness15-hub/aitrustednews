<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Intelligence Dispatch</title>
    <style>
        :root { --bg-color: #f8fafc; --text-color: #0f172a; --glow-color: #1e3a8a; }
        body.dark-mode { --bg-color: #050505; --text-color: #f1f5f9; --glow-color: #38bdf8; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Georgia', serif; padding: 20px; }

        /* Navigation: Login/Register Top Left */
        .auth-nav { position: absolute; top: 20px; left: 24px; }
        .auth-btn { background: none; border: 1px solid var(--text-color); padding: 8px 16px; cursor: pointer; color: var(--text-color); font-weight: bold; }
        
        .theme-toggle-btn { position: absolute; top: 20px; right: 24px; background: none; border: 1px solid var(--text-color); padding: 8px 16px; cursor: pointer; color: var(--text-color); }

        header { text-align: center; margin-top: 60px; }
        
        /* Search Bar Area (Authenticated Only) */
        #search-container { display: none; margin: 30px auto; max-width: 800px; text-align: center; }
        #search-bar { width: 100%; padding: 15px; border: 2px solid var(--glow-color); border-radius: 8px; font-size: 1rem; }

        .category-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; max-width: 1400px; margin: 40px auto; }
        
        .category-card { background: var(--text-color); color: var(--bg-color); padding: 20px; border-radius: 12px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <nav class="auth-nav">
        <button class="auth-btn" onclick="login()">Login / Register</button>
    </nav>
    <button class="theme-toggle-btn" id="theme-switch" onclick="toggleThemeMode()">Dark Mode</button>

    <header>
        <h1>The Global Intelligence Dispatch</h1>
        <div id="search-container">
            <input type="text" id="search-bar" placeholder="AI-Assisted Search: What intelligence are you seeking?">
        </div>
    </header>

    <main class="category-grid" id="category-grid"></main>

    <script>
        let isLoggedIn = false;

        function login() {
            isLoggedIn = true;
            document.querySelector('.auth-nav').innerHTML = '<button class="auth-btn">Inventory / Folders</button>';
            document.getElementById('search-container').style.display = 'block';
            alert("Authenticated. Inventory and AI Search activated.");
        }

        function toggleThemeMode() {
            document.body.classList.toggle('dark-mode');
        }

        const viralTopics = ["AI", "War", "Economy", "Crypto", "Tech", "Science", "Climate", "Creator", "Cyber", "Sports"];
        const grid = document.getElementById('category-grid');
        viralTopics.forEach(t => {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.innerHTML = `<h3>${t}</h3>`;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
