<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Trusted News</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
        nav { display: flex; gap: 15px; margin-bottom: 20px; }
        button { padding: 10px 20px; cursor: pointer; }
        #news-container { border: 1px solid #ddd; padding: 20px; background: #f9f9f9; }
    </style>
</head>
<body>

    <nav>
        <button onclick="location.reload()">Refresh News</button>
        <button onclick="window.location.href='login.html'">Login</button>
    </nav>

    <h1>Latest AI News</h1>
    <div id="news-container">Loading news from robot...</div>

    <script>
        fetch('news_data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('news-container').innerHTML = data.news.replace(/\n/g, '<br>');
            })
            .catch(error => {
                document.getElementById('news-container').innerText = "Could not load news. Check if the JSON file exists.";
            });
    </script>

</body>
</html>
