<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AI Trusted News Hub</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #111; font-size: 22px; }
        .btn-google { background-color: #2d5596; color: white; width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        .btn-google:hover { background-color: #1e3d73; }
        .divider { margin: 15px 0; color: #777; font-size: 14px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background-color: #007bff; color: white; width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.2s; }
        .btn-submit:hover { background-color: #0056b3; }
        .links-container { margin-top: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
        a { color: #007bff; text-decoration: none; cursor: pointer; font-weight: 500; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="auth-title">Log In to Your Account</h2>
    <button class="btn-google" id="google-btn">Continue with Google</button>
    <div class="divider">— OR —</div>

    <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email-input" placeholder="name@example.com">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password-input" placeholder="••••••••">
    </div>

    <button class="btn-submit" id="submit-btn">Sign In</button>

    <div class="links-container">
        <a id="forgot-password-link">Forgot Password? Recovery via Email</a>
        <a id="toggle-auth-link">Need an account? Sign Up instead</a>
        <a href="index.html" style="color: #666;">← Cancel and Back Home</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        sendPasswordResetEmail,
        GoogleAuthProvider,
        signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3o1FGG5wdp-bFD6BIZRRvrxhzgsVsMSY",
      authDomain: "new-projects-d395e.firebaseapp.com",
      projectId: "new-projects-d395e",
      storageBucket: "new-projects-d395e.firebasestorage.app",
      messagingSenderId: "75698298535",
      appId: "1:75698298535:web:f2a57bf32b5fc1ab184582",
      measurementId: "G-5J3K4NRJYN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const provider = new GoogleAuthProvider();

    let isLoginMode = true;

    const authTitle = document.getElementById("auth-title");
    const submitBtn = document.getElementById("submit-btn");
    const toggleAuthLink = document.getElementById("toggle-auth-link");
    const forgotPasswordLink = document.getElementById("forgot-password-link");
    const emailInput = document.getElementById("email-input");
    const passwordInput = document.getElementById("password-input");
    const googleBtn = document.getElementById("google-btn");

    // Smoothly alternate layout spaces between Login and Registration states
    toggleAuthLink.onclick = () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            authTitle.innerText = "Log In to Your Account";
            submitBtn.innerText = "Sign In";
            toggleAuthLink.innerText = "Need an account? Sign Up instead";
            forgotPasswordLink.style.display = "inline-block";
        } else {
            authTitle.innerText = "Create Your Account";
            submitBtn.innerText = "Create Account & Verify";
            toggleAuthLink.innerText = "Already have an account? Log In instead";
            forgotPasswordLink.style.display = "none";
        }
    };

    // Integrated Reset Email Execution Handler
    forgotPasswordLink.onclick = () => {
        const email = emailInput.value.trim();
        if (!email) {
            alert("Please input your Email Address above first so the system knows where to transmit the recovery link.");
            return;
        }

        sendPasswordResetEmail(auth, email)
            .then(() => {
                alert("Success! A secure password reset link has been dispatched to your email address. Please inspect your inbox/spam folder.");
            })
            .catch((error) => {
                alert("Reset Request Failed: " + error.message);
            });
    };

    // Form Core Authentication Submission Processing
    submitBtn.onclick = () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            alert("Please enter both email and password parameters to proceed.");
            return;
        }

        if (isLoginMode) {
            signInWithEmailAndPassword(auth, email, password)
                .then(() => { window.location.href = 'index.html'; })
                .catch((error) => { alert("Login Failed: " + error.message); });
        } else {
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => { window.location.href = 'index.html'; })
                .catch((error) => { alert("Registration Failed: " + error.message); });
        }
    };

    // Backup Instant Google Sign-In Routing 
    googleBtn.onclick = () => {
        signInWithPopup(auth, provider)
            .then(() => { window.location.href = 'index.html'; })
            .catch((error) => { alert("Google Authentication Failed: " + error.message); });
    };
</script>
</body>
</html>
